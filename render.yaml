services:
  - type: web
    name: task-manager-backend
    env: node
    repo: https://github.com/Sanjay-2oo6/TaskManager
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    region: singapore
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_BUCKET_NAME
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MASTER_ADMIN_USERNAME
        value: superadmin
