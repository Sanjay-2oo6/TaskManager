name: task_manager
description: A collaborative task management system with offline-first support.
version: 1.3.0+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase (Notifications)
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1

  # Local Persistence (Offline-First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Connectivity
  connectivity_plus: ^6.0.3
  
  # Networking
  dio: ^5.4.1
  
  # Utilities
  uuid: ^4.5.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  logger: ^2.1.0
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  http: ^1.6.0
  socket_io_client: ^3.1.4
  ota_update: ^7.0.0
  package_info_plus: ^9.0.1
  flutter_dotenv: ^6.0.0
  
  # Analytics & Charts (using custom UI with progress bars and chips)
  flutter_test:
    sdk: flutter
  
  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  
  # Lints
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Add assets if needed later
  assets:
    - .env
